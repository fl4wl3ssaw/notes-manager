<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Менеджер нотаток</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/script.js" defer></script>
</head>
<body>

<!-- Шапка з назвою -->
<header class="header">
    <h1 class="header-title">Менеджер нотаток</h1>
    <nav class="nav">
        <a href="#new" class="nav-link">Нова нотатка</a>
        <a href="#list" class="nav-link">Мої нотатки</a>
    </nav>
</header>

<!-- Обгортка для десктопної сітки (main + aside) -->
<div class="layout-wrapper">
    <main class="main">
        <!-- Форма створення нотатки -->
        <section class="section" id="new">
            <h2 class="section-title">Нова нотатка</h2>
            <form class="form">
                <label for="title" class="form-label">Заголовок:</label>
                <input type="text" id="title" class="form-input" required>

                <label for="excerpt" class="form-label">Уривок (до 300 символів):</label>
                <textarea id="excerpt" class="form-input form-textarea" maxlength="300" required aria-describedby="excerpt-counter"></textarea>
                <p class="character-counter" id="excerpt-counter" aria-live="polite">0 / 300 символів</p>
                <label for="category" class="form-label">Категорія:</label>
                <select id="category" class="form-input">
                    <option value="Паролі">Паролі</option>
                    <option value="Ідеї">Ідеї</option>
                    <option value="Особисте">Особисте</option>
                </select>
                <label for="date" class="form-label">Дата:</label>
                <input type="date" id="date" class="form-input">
                <button type="submit" class="form-button">Додати нотатку</button>
            </form>
        </section>

        <!-- Список нотаток (картки із заголовком і уривком) -->
        <section class="section" id="list">
            <h2 class="section-title">Мої нотатки</h2>

            <!-- Крок 7: Покажіть окремий індикатор, поки очікується відповідь API. -->
            <p id="loading-indicator" class="loading-indicator" role="status" aria-live="polite" hidden>Завантаження нотаток…</p>
            <!-- Крок 8: Покажіть зрозумілу помилку та кнопку повторного запиту. -->
            <div id="notes-error" class="notes-error" role="alert" hidden>
                <p id="notes-error-message"></p>
                <button type="button" class="form-button" id="retry-button">Оновити</button>
            </div>
            <p id="notes-count" class="notes-count">Кількість нотаток: 0</p>
            <div class="cards-container" id="notes-list">
            </div>
        </section>
    </main>

    <!-- Блок перегляду обраної нотатки повністю -->
    <aside class="sidebar">
        <h2 class="sidebar-title">Перегляд обраної нотатки</h2>
        <article class="note-card note-card--full" aria-live="polite">
            <p class="note-category" id="selected-category">Натисніть на нотатку у списку</p>
            <h3 class="note-title" id="selected-title">Нотатку не вибрано</h3>
            <p class="note-text" id="selected-text">Повний текст вибраної нотатки з’явиться тут.</p>
            <p class="note-date" id="selected-date"></p>
        </article>
    </aside>
</div>

<!-- Підвал -->
<footer class="footer">
    <p class="footer-text">Автор проєкту: Лаба Іван, 2026</p>
</footer>

</body>
</html>
