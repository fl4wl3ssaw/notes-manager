<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Менеджер нотаток</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Крок 2: Підключіть React 18, ReactDOM і Babel Standalone через CDN. -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset('react-classic', {
            presets: [[Babel.availablePresets.react, { runtime: 'classic' }]]
        });
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react-classic" src="js/script.js"></script>
</body>
</html>
